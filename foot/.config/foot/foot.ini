# Caelus colors (palette: ~/dotfiles/README.md). foot --server is started by
# Mango (config/autostart.conf).

[colors-dark]
alpha=1
background=0f0f0f
blur=false
bright0=3b403c
bright1=ef968f
bright2=98d694
bright3=f4b585
bright4=b0d4e8
bright5=ebadd6
bright6=abd4bf
bright7=f4decd
cursor=0f0f0f ef934d
foreground=f4decd
regular0=0f0f0f
regular1=f16e65
regular2=72ca68
regular3=ef934d
regular4=71b4d6
regular5=e28dc6
regular6=7ec9a3
regular7=d9cdb5
search-box-match=0f0f0f ef934d
search-box-no-match=0f0f0f f16e65
selection-background=ef934d
selection-foreground=0f0f0f
urls=71b4d6

[cursor]
blink=true
style=block

[main]
dpi-aware=true
font=Iosevka Nerd Font Mono:size=16
pad=7x2
shell=/usr/bin/zsh

[mouse]
hide-when-typing=yes

[scrollback]
lines=100000
