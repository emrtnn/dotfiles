# tmux for servers: persistent sessions with my prefix, keybinds and the
# Caelus look. No plugins, no external tools, nothing tied to my desktop.
# Needs tmux >= 3.2 (Debian 12, Ubuntu 22.04, RHEL 9 and newer).
#
# Install on a server (tmux reads ~/.config/tmux/tmux.conf):
#   ssh host 'mkdir -p ~/.config/tmux'
#   scp ~/dotfiles/tmux/.config/tmux/tmux.conf host:.config/tmux/tmux.conf

# tmux-256color when the server's terminfo has it, screen-256color otherwise
# (older or minimal hosts), so programs inside never see an unknown $TERM.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

bind -N "Select pane to the left of the active pane" h select-pane -L
bind -N "Select pane below the active pane" j select-pane -D
bind -N "Select pane above the active pane" k select-pane -U
bind -N "Select pane to the right of the active pane" l select-pane -R

bind -r -N "Resize the pane left by 3" \
  H resize-pane -L 3
bind -r -N "Resize the pane down by 3" \
  J resize-pane -D 3
bind -r -N "Resize the pane up by 3" \
  K resize-pane -U 3
bind -r -N "Resize the pane right by 3" \
  L resize-pane -R 3

# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     100000

set -g renumber-windows on
set -g status-position top
set -g status-interval 5
set -g display-time 1500

# Ghostty over SSH: TERM is xterm-ghostty once Ghostty has installed its
# terminfo on the host (true color and clipboard come from it), xterm-256color
# before that. extkeys passes modified keys (C-Enter, S-Tab...) to editors.
set -as terminal-features ',xterm-ghostty:extkeys,xterm-256color:RGB:extkeys'
set -g extended-keys on

# Native Caelus styling
set -g status-right '#[fg=#d9cdb5,bg=#272a28] #H #[fg=#9a9c8b,bg=#141514] %Y-%m-%d #[fg=#ef934d]%H:%M '
set -g status-style 'bg=#141514,fg=#f4decd'
set -g status-left-length 60
set -g status-right-length 100
set -g status-left '#[fg=#0f0f0f,bg=#{?client_prefix,#efbf71,#ef934d},bold] #{?client_prefix,PREFIX ,}#S#[default] '
set -g window-status-style 'bg=#1e1f1e,fg=#9a9c8b'
set -g window-status-format ' #I:#W#{?window_flags, #F,} '
set -g window-status-current-style 'bg=#ef934d,fg=#0f0f0f,bold'
set -g window-status-current-format ' #I:#W#{?window_flags, #F,} '
set -g window-status-activity-style 'bg=#1e1f1e,fg=#72ca68'
set -g window-status-bell-style 'bg=#f16e65,fg=#0f0f0f,bold'
set -g window-status-last-style 'fg=#f4b585'
set -g window-status-separator ' '
set -g message-style 'bg=#1e1f1e,fg=#f4decd'
set -g message-command-style 'bg=#1e1f1e,fg=#ef934d'
set -g mode-style 'bg=#3b403c,fg=#f4decd'
set -g clock-mode-colour '#ef934d'
# Menu styles only exist since 3.4; older servers keep the default menus.
%if #{>=:#{version},3.4}
set -g menu-style 'bg=#1e1f1e,fg=#f4decd'
set -g menu-selected-style 'bg=#ef934d,fg=#0f0f0f,bold'
set -g menu-border-style 'fg=#585f5b'
%endif
set -g pane-border-style 'fg=#3b403c'
set -g pane-active-border-style 'fg=#ef934d,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_current_command} #{?pane_active,*,} '
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Keep tmux's native session/window pickers (prefix+s / prefix+w).
# New windows and both native and mnemonic splits follow the current pane.
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind p display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'
bind x kill-pane

# Bind 'e' to sessions tree explorer since its default keybind was 's'
bind e choose-tree -s

# Native vi copy mode. Copies (y, Enter, mouse drag) go to my local clipboard
# through the terminal (OSC 52), so nothing is needed on the server. `on`
# also lets programs inside tmux (e.g. Neovim over SSH) set it.
set -s set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
