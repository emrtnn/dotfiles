# Plugins are managed by TPM, which bootstraps itself into ~/.local/share/tmux/plugins on first start
# (prefix + I installs, prefix + U updates).

set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1
# We need to set default-shell before calling new-session
set  -g default-shell "/usr/bin/zsh"

set -g status-keys vi
set -g mode-keys   vi

bind -N "Select pane to the left of the active pane" h select-pane -L
bind -N "Select pane below the active pane" j select-pane -D
bind -N "Select pane above the active pane" k select-pane -U
bind -N "Select pane to the right of the active pane" l select-pane -R

bind -r -N "Resize the pane left by 3" \
  H resize-pane -L 3
bind -r -N "Resize the pane down by 3" \
  J resize-pane -D 3
bind -r -N "Resize the pane up by 3" \
  K resize-pane -U 3
bind -r -N "Resize the pane right by 3" \
  L resize-pane -R 3

# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     100000

# ============================================= #
# Plugins (TPM)                                 #
# --------------------------------------------- #

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect
# Restore layouts and working directories, not SSH or agent commands.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'

# tmux-continuum: TPM runs it at the very end of this file (after status-right
# is set below), so its autosave hook in status-right survives.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# ============================================= #

set -g renumber-windows on
set -g status-position top
set -g status-interval 5
set -g display-time 1500

# Ghostty/Kitty capabilities, focus reporting, and Yazi image passthrough.
set -as terminal-features ',xterm-kitty:RGB:extkeys,xterm-ghostty:RGB:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -ga update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS TERM_PROGRAM'

# Native Caelus styling. status-right must be set before continuum loads.
set -g status-right '#[fg=#d9cdb5,bg=#272a28] #H #[fg=#9a9c8b,bg=#141514] %Y-%m-%d #[fg=#ef934d]%H:%M '
set -g status-style 'bg=#141514,fg=#f4decd'
set -g status-left-length 60
set -g status-right-length 100
set -g status-left '#[fg=#0f0f0f,bg=#{?client_prefix,#efbf71,#ef934d},bold] #{?client_prefix,PREFIX ,}#S#[default] '
set -g window-status-style 'bg=#1e1f1e,fg=#9a9c8b'
set -g window-status-format ' #I:#W#{?window_flags, #F,} '
set -g window-status-current-style 'bg=#ef934d,fg=#0f0f0f,bold'
set -g window-status-current-format ' #I:#W#{?window_flags, #F,} '
set -g window-status-activity-style 'bg=#1e1f1e,fg=#72ca68'
set -g window-status-bell-style 'bg=#f16e65,fg=#0f0f0f,bold'
set -g window-status-last-style 'fg=#f4b585'
set -g window-status-separator ' '
set -g message-style 'bg=#1e1f1e,fg=#f4decd'
set -g message-command-style 'bg=#1e1f1e,fg=#ef934d'
set -g mode-style 'bg=#3b403c,fg=#f4decd'
set -g clock-mode-colour '#ef934d'
set -g menu-style 'bg=#1e1f1e,fg=#f4decd'
set -g menu-selected-style 'bg=#ef934d,fg=#0f0f0f,bold'
set -g menu-border-style 'fg=#585f5b'
set -g pane-border-style 'fg=#3b403c'
set -g pane-active-border-style 'fg=#ef934d,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_current_command} #{?pane_active,*,} '
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# smart-splits.nvim (backend-tmux): Ctrl+h/j/k/l moves and Alt+h/j/k/l
# resizes across Neovim splits and tmux panes without a prefix. Neovim
# marks its pane with @pane-is-vim; at the edge, select-pane wraps
# (matches smart-splits' default move.at_edge = 'wrap').
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

bind C-l send-keys C-l

# Keep tmux's native session/window pickers (prefix+s / prefix+w).
# New windows and both native and mnemonic splits follow the current pane.
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind p display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'
bind x kill-pane

# Bind 'e' to sessions tree explorer since its default keybind was 's'
bind e choose-tree -s

# Native vi copy mode; both keyboard and mouse copy to the Wayland clipboard.
set -s set-clipboard external
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ============================================= #
# TPM: bootstrap on first start, then load the plugins. Keep last.
if-shell "test ! -d $HOME/.local/share/tmux/plugins/tpm" \
  "run-shell 'git clone -q https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"
