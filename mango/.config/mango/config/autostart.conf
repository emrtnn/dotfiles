# Hand Mango's environment (env.conf, plus what it inherited from the login
# shell: PATH, EDITOR, ...) to systemd and D-Bus. Mango itself only exports
# the display and cursor variables, and Noctalia launches apps as systemd
# units, so without this they'd miss env.conf.
exec_once=dbus-update-activation-environment --systemd --all

# Noctalia owns wallpaper, panels, notifications, OSD, idle/lock UI, launcher,
# control center, and screen-recorder UI in this setup

exec_once=noctalia
