# ---- Window rules -----------------------------------------------------------
# Mango rule to ignore client maximize requests.
window_rule=ignore_maximize:1,app_id:.*

# Floating app rules.
window_rule=is_floating:1,app_id:^com\.gabm\.satty$
window_rule=is_floating:1,width:900,height:800,app_id:localsend
window_rule=is_floating:1,width:600,height:1050,app_id:^org\.telegram\.desktop$

# No transparent apps rules
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,no_blur:1,app_id:^blender$

# ---- Layer rules ------------------------------------------------------------
# Noctalia integration: keep wallpaper/background layers clean and performant.
layer_rule=no_animation:1,no_blur:1,no_shadow:1,layer_name:^noctalia-wallpaper
layer_rule=animation_type_open:slide,animation_type_close:fade,layer_name:^noctalia-background
layer_rule=no_animation:1,no_blur:1,layer_name:selection

