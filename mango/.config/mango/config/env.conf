# ---- Session/environment ----------------------------------------------------
# Variables for the graphical session. Mango sets them for everything it
# starts; autostart.conf also hands them to systemd, so apps Noctalia launches
# as systemd units get them too. Values can't use $VARS (only a leading ~/).
# The cursor (XCURSOR_THEME/SIZE) comes from misc.conf.

# Toolkits on Wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_IM_MODULES,wayland
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland

# Qt theming: qt6ct (Caelus palette) with the Breeze style
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_STYLE_OVERRIDE,breeze

# Outside Plasma, Dolphin's "Open With" needs a menu file; this selects
# /etc/xdg/menus/arch-applications.menu (archlinux-xdg-menu)
env=XDG_MENU_PREFIX,arch-

# Java/Swing (Burp Suite) on a non-reparenting compositor
env=_JAVA_AWT_WM_NONREPARENTING,1

# Default browser for apps that read $BROWSER
env=BROWSER,librewolf
